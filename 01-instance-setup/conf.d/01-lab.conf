# ---------------------------------------------------------------
# Lab instance configuration
# Every setting here is a deliberate change from the default.
# Sized for 3.7 GiB available to WSL2 — verified with `free -h`.
# ---------------------------------------------------------------

# --- CONNECTIONS ---
listen_addresses = 'localhost'   # widen in the replication lab
port = 5432
max_connections = 100

# --- MEMORY ---
shared_buffers = 768MB           # ~20% of available. Conservative because WSL
                                 # shares this RAM with every other process.
effective_cache_size = 2GB       # planner HINT about OS cache; allocates nothing
work_mem = 4MB                   # PER sort/hash, PER connection. 100 connections
                                 # doing several sorts each is how a small box OOMs.
maintenance_work_mem = 128MB     # VACUUM, CREATE INDEX, ALTER TABLE.
                                 # x3 autovacuum workers = 384MB worst case.

# --- WAL / CHECKPOINTS ---
wal_level = replica              # minimum for replication and PITR (labs 02, 03)
max_wal_size = 2GB
min_wal_size = 128MB
checkpoint_completion_target = 0.9   # spread checkpoint I/O rather than spiking

# --- LOGGING ---
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_line_prefix = '%m [%p] %q%u@%d '
log_statement = 'ddl'                  # schema changes only; 'all' is too noisy
log_min_duration_statement = 250       # anything over 250ms — your tuning input
log_checkpoints = on
log_connections = on
log_disconnections = on
log_autovacuum_min_duration = 0        # see every autovacuum while learning

# --- EXTENSIONS ---
shared_preload_libraries = 'pg_stat_statements'   # requires RESTART, not reload
pg_stat_statements.track = all
